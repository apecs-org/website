name: Test

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/test_db
      DJANGO_SETTINGS_MODULE: apecs.settings.test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_db
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Python stage of Dockerfile
        run: |
          docker build --target python -t apecs-python .

      - name: Run Django migrations
        run: |
          docker run --rm \
            --network host \
            --env POSTGRES_USER=${{ env.POSTGRES_USER }} \
            --env POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }} \
            --env POSTGRES_DB=${{ env.POSTGRES_DB }} \
            --env POSTGRES_HOST=${{ env.POSTGRES_HOST }} \
            --env POSTGRES_PORT=${{ env.POSTGRES_PORT }} \
            --env DJANGO_SETTINGS_MODULE=${{ env.DJANGO_SETTINGS_MODULE }} \
            apecs-python \
            poetry run python manage.py migrate --noinput

      - name: Run Django tests
        run: |
          docker run --rm \
            --network host \
            --env POSTGRES_USER=${{ env.POSTGRES_USER }} \
            --env POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }} \
            --env POSTGRES_DB=${{ env.POSTGRES_DB }} \
            --env POSTGRES_HOST=${{ env.POSTGRES_HOST }} \
            --env POSTGRES_PORT=${{ env.POSTGRES_PORT }} \
            --env DJANGO_SETTINGS_MODULE=${{ env.DJANGO_SETTINGS_MODULE }} \
            apecs-python \
            poetry run python manage.py test

