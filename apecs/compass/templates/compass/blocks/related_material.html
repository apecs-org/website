<div class="my-6">
    <div class="grid
        {% if self.resources|length == 2 %} grid-cols-1 sm:grid-cols-2
        {% elif self.resources|length == 3 %} grid-cols-1 lg:grid-cols-3
        {% else %} grid-cols-1
        {% endif %} gap-4">
        {% for resource in self.resources %}
            <div class="p-6 bg-white rounded-xl shadow-md border border-gray-200 hover:shadow-lg transition">
                <h4 class="text-lg font-semibold text-gray-800">{{ resource.title }}</h4>
                {% if resource.description %}
                    <p class="text-gray-600 mt-2 text-sm">{{ resource.description }}</p>
                {% endif %}
                <a href="{{ resource.url }}" target="_blank" rel="noopener noreferrer"
                   class="inline-block mt-3 text-blue-600 font-medium hover:underline">
                    Access resource →
                </a>
            </div>
        {% endfor %}
    </div>
</div>
