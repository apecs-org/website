{% extends "compass/base.html" %}
{% load static wagtailcore_tags wagtailimages_tags %}


{% block content %}

    <div class="relative isolate overflow-hidden bg-white px-6 py-6 sm:py-8 lg:px-8 dark:bg-gray-900">
        <div class="mx-auto max-w-4xl text-center">
            <h2 class="text-5xl font-semibold tracking-tight text-gray-900 sm:text-7xl dark:text-white">
                {{ category.name }}
            </h2>
            <p class="mt-4 text-pretty text-lg font-medium text-gray-700 sm:text-xl/8 dark:text-gray-400">
                {{ category.description }}
            </p>
        </div>
    </div>

    {% include "compass/components/resource_list.html" with resources=resources %}

{% endblock %}
