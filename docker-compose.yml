networks:
  apecs-network:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - apecs-network

  postgres:
    image: postgres:14-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apecsuser
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: apecs
    ports:
      - "5432:5432"
    volumes:
      - apecs-data:/var/lib/postgresql/data/
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "apecsuser", "-d", "apecs" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apecs-network

  celery_worker:
    build:
      context: .
      target: python
    container_name: celery_worker
    restart: unless-stopped
    command: /home/apecsuser/apecs/.venv/bin/celery -A apecs worker --loglevel=info
    environment:
      DJANGO_SETTINGS_MODULE: apecs.settings.dev
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://apecsuser:admin@postgres:5432/apecs
      POSTGRES_USER: apecsuser
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: apecs
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    networks:
      - apecs-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      target: python
    container_name: celery_beat
    restart: unless-stopped
    command: /home/apecsuser/apecs/.venv/bin/celery -A apecs beat --loglevel=info
    environment:
      DJANGO_SETTINGS_MODULE: apecs.settings.dev
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://apecsuser:admin@postgres:5432/apecs
      POSTGRES_USER: apecsuser
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: apecs
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    networks:
      - apecs-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  apecs-data:
    external: true